server {
    listen 80;
    listen [::]:80;
    server_name agendex.icu www.agendex.icu;
    return 301 https://agendex.icu$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.agendex.icu;
    ssl_certificate /etc/nginx/ssl/agendex.icu/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/agendex.icu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://agendex.icu$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name agendex.icu;
    ssl_certificate /etc/nginx/ssl/agendex.icu/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/agendex.icu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8m;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
